# Build and deploy MkDocs documentation plus generated viewer-data/latest on main.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (docs + env so mkdocstrings can import labtrust_gym)
        run: pip install -e '.[docs,env]'

      - name: Build MkDocs
        run: mkdocs build --strict

      - name: Checkout pinned PCS dependency for release viewer
        uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          ref: 9c971f5f9da8a424924dd8f48d6a3b71a1009e1b
          path: pcs-core

      - name: Prepare pinned PCS Python package
        run: python scripts/ci/prepare_pcs_core_python.py pcs-core

      - name: Install PCS dependency for release viewer
        run: python -m pip install -e pcs-core/python

      - name: Install package for viewer-data build
        run: pip install -e '.[dev,env,plots]'

      - name: Build viewer-data from release
        run: bash scripts/build_viewer_data_from_release.sh

      - name: Stage generated release data in documentation site
        run: |
          test -s viewer-data/latest/latest.json
          test -s viewer-data/latest/RISK_REGISTER_BUNDLE.v0.1.json
          mkdir -p site/viewer-data
          cp -a viewer-data/latest site/viewer-data/
          test -s site/viewer-data/latest/latest.json
          test -s site/viewer-data/latest/RISK_REGISTER_BUNDLE.v0.1.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Deploy errors remain blocking. Configure Pages to use GitHub Actions in repository settings.
