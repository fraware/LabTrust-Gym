name: PCS QC-release

on:
  push:
    branches: [main]
    paths:
      - "src/labtrust_gym/pcs/**"
      - "src/labtrust_gym/cli/pcs.py"
      - "policy/pcs/**"
      - "policy/schemas/pcs/**"
      - "examples/pcs_qc_release/**"
      - "tests/pcs/**"
      - "docs/pcs*.md"
      - ".github/workflows/pcs.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/labtrust_gym/pcs/**"
      - "src/labtrust_gym/cli/pcs.py"
      - "policy/pcs/**"
      - "policy/schemas/pcs/**"
      - "examples/pcs_qc_release/**"
      - "tests/pcs/**"
      - "docs/pcs*.md"
      - ".github/workflows/pcs.yml"

jobs:
  pcs:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core
      - name: Apply LabTrust RuntimeReceipt profile to pcs-core schemas
        run: |
          cp policy/schemas/pcs/runtime_receipt.v0.schema.json \
            pcs-core/schemas/RuntimeReceipt.v0.schema.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pcs-core and LabTrust-Gym
        run: |
          pip install -e "pcs-core/python"
          pip install -e ".[dev,pcs]"
      - name: PCS tests
        run: python -m pytest tests/pcs -q
      - name: Validate committed golden artifacts (pcs-core)
        run: |
          python -c "
          import json
          from pathlib import Path
          from pcs_core.validate import validate_artifact
          root = Path('examples/pcs_qc_release/expected')
          for name in (
              'valid_runtime_receipt.json',
              'valid_science_claim_bundle.pending.json',
              'valid_science_claim_bundle.certified.json',
              'trace_certificate.v0.json',
              'invalid_missing_qc_runtime_receipt.json',
              'invalid_unauthorized_runtime_receipt.json',
          ):
              path = root / name
              validate_artifact(json.loads(path.read_text()))
              print('OK', name)
          "
      - name: LabTrust-only smoke (deterministic)
        run: bash examples/pcs_qc_release/scripts/labtrust_only_smoke.sh
      - name: Invalid scenarios export receipts
        run: |
          export PCS_DETERMINISTIC=1
          labtrust run-demo qc-release-invalid-missing-qc --deterministic --out /tmp/missing-qc
          labtrust run-demo qc-release-invalid-unauthorized --deterministic --out /tmp/unauthorized
          labtrust export-runtime-receipt --run /tmp/missing-qc --out /tmp/missing_qc_receipt.json
          labtrust export-runtime-receipt --run /tmp/unauthorized --out /tmp/unauthorized_receipt.json
          python -c "
          import json
          from pcs_core.validate import validate_artifact
          for p in ('/tmp/missing_qc_receipt.json', '/tmp/unauthorized_receipt.json'):
              r = json.load(open(p))
              assert r['run_outcome'] == 'failed', p
              validate_artifact(r)
              print('OK', p, r['final_reason_code'])
          "
