name: PCS QC-release

on:
  push:
    branches: [main]
    paths:
      - "src/labtrust_gym/pcs/**"
      - "src/labtrust_gym/cli/pcs.py"
      - "policy/pcs/**"
      - "policy/schemas/pcs/**"
      - "examples/pcs_qc_release/**"
      - "tests/pcs/**"
      - "docs/pcs/**"
      - "docs/pcs*.md"
      - "scripts/sync_pcs_bench_labtrust_suite.py"
      - "scripts/publish_pcs_bench_fixtures.py"
      - "tests/fixtures/pcs_bench_reproducibility/**"
      - "examples/pcs_qc_release/scripts/ci_validate_pcs_producer_contract.py"
      - "policy/schemas/pcs/WorkflowProfile.v0.schema.json"
      - "policy/schemas/pcs/WorkflowProfile.formalization.extension.schema.json"
      - "scripts/apply_pcs_core_labtrust_schema_profiles.py"
      - "policy/schemas/pcs/RegenerationReport.v0.schema.json"
      - "policy/schemas/pcs/FailureCaseManifest.v0.schema.json"
      - "policy/schemas/pcs/BenchmarkCase.v0.schema.json"
      - "policy/schemas/pcs/BenchmarkArtifactRef.v0.schema.json"
      - "policy/schemas/pcs/ReproducibilityBenchmarkManifest.v0.schema.json"
      - "schemas_or_docs/**"
      - "templates/pcs_workflow_template/**"
      - "Makefile"
      - "scripts/pcs_bench_producer.*"
      - "scripts/generate_pcs_bench_ingest_fixture.py"
      - "tests/fixtures/pcs_bench_ingest/**"
      - ".github/workflows/pcs.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/labtrust_gym/pcs/**"
      - "src/labtrust_gym/cli/pcs.py"
      - "policy/pcs/**"
      - "policy/schemas/pcs/**"
      - "examples/pcs_qc_release/**"
      - "tests/pcs/**"
      - "docs/pcs/**"
      - "docs/pcs*.md"
      - "scripts/sync_pcs_bench_labtrust_suite.py"
      - "scripts/publish_pcs_bench_fixtures.py"
      - "tests/fixtures/pcs_bench_reproducibility/**"
      - "examples/pcs_qc_release/scripts/ci_validate_pcs_producer_contract.py"
      - "policy/schemas/pcs/WorkflowProfile.v0.schema.json"
      - "policy/schemas/pcs/WorkflowProfile.formalization.extension.schema.json"
      - "scripts/apply_pcs_core_labtrust_schema_profiles.py"
      - "policy/schemas/pcs/RegenerationReport.v0.schema.json"
      - "policy/schemas/pcs/FailureCaseManifest.v0.schema.json"
      - "policy/schemas/pcs/BenchmarkCase.v0.schema.json"
      - "policy/schemas/pcs/BenchmarkArtifactRef.v0.schema.json"
      - "policy/schemas/pcs/ReproducibilityBenchmarkManifest.v0.schema.json"
      - "schemas_or_docs/**"
      - "templates/pcs_workflow_template/**"
      - "Makefile"
      - "scripts/pcs_bench_producer.*"
      - "scripts/generate_pcs_bench_ingest_fixture.py"
      - "tests/fixtures/pcs_bench_ingest/**"
      - ".github/workflows/pcs.yml"

jobs:
  pcs:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core
      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-bench
          path: pcs-bench
      - name: Apply LabTrust pcs-core schema profiles
        run: python scripts/apply_pcs_core_labtrust_schema_profiles.py --pcs-core pcs-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pcs-core, pcs-bench, and LabTrust-Gym
        run: |
          pip install -e "pcs-core/python"
          pip install -e "pcs-bench"
          pip install -e ".[dev,pcs]"
      - name: PCS tests
        run: python -m pytest tests/pcs -q
      - name: Validate WorkflowProfile.v0 reference
        run: python examples/pcs_qc_release/scripts/ci_validate_workflow_profile.py
      - name: Verify pcs-core canonical hash vectors
        run: python -m pcs_core.hash_vectors --verify
      - name: Strict pcs-core validate exported artifacts + committed goldens
        run: python examples/pcs_qc_release/scripts/ci_validate_pcs_exports.py
      - name: Validate committed release fixtures (pcs-core + registry)
        run: python examples/pcs_qc_release/scripts/ci_validate_release_fixtures.py
      - name: Validate regeneration_report.json (pcs-bench contract)
        run: python examples/pcs_qc_release/scripts/ci_validate_regeneration_report.py
      - name: Validate failure_case_manifest.json gallery metadata
        run: python examples/pcs_qc_release/scripts/ci_validate_failure_manifests.py
      - name: Validate proof-obligation formalization artifacts
        run: python examples/pcs_qc_release/scripts/ci_validate_formalization.py
      - name: Generate and validate benchmark cases
        run: |
          labtrust generate-benchmark-cases \
            --workflow hospital_lab.qc_release \
            --out /tmp/labtrust-bench \
            --release-dir examples/pcs_qc_release/release \
            --seed 42
          labtrust verify-benchmark-cases --benchmark-dir /tmp/labtrust-bench
          labtrust generate-benchmark-cases \
            --workflow hospital_lab.qc_release \
            --out /tmp/labtrust-bench-layout \
            --release-dir examples/pcs_qc_release/release \
            --pcs-bench-layout \
            --seed 42 \
            --validate-pcs-core-output pcs-core
          labtrust verify-benchmark-cases \
            --benchmark-dir /tmp/labtrust-bench-layout \
            --validate-pcs-core-output pcs-core
          labtrust generate-benchmark-cases \
            --workflow hospital_lab.qc_release \
            --out examples/pcs_qc_release/benchmark \
            --release-dir examples/pcs_qc_release/release \
            --seed 42
          python examples/pcs_qc_release/scripts/ci_validate_benchmark_cases.py
          python examples/pcs_qc_release/scripts/ci_validate_benchmark_pcs_core.py
          python examples/pcs_qc_release/scripts/ci_validate_benchmark_pcs_bench_layout.py
          python examples/pcs_qc_release/scripts/ci_validate_benchmark_registry_expected.py
      - name: Validate pcs-core labtrust-qc-release benchmark suite
        run: python examples/pcs_qc_release/scripts/ci_validate_pcs_core_labtrust_suite.py
      - name: pcs-bench validate fixtures (when pcs-core checkout present)
        continue-on-error: true
        run: |
          if command -v pcs >/dev/null 2>&1; then
            pcs benchmark validate
          elif [ -d pcs-core/python ]; then
            python -m pcs_core.cli benchmark validate
          else
            echo "skip pcs-bench validate (no pcs-core CLI)"
          fi
      - name: Reproducibility benchmark
        run: python examples/pcs_qc_release/scripts/ci_benchmark_reproducibility.py
      - name: Reproducibility ingest (PcsBenchIngest.v0)
        run: python examples/pcs_qc_release/scripts/ci_validate_benchmark_ingest_golden.py
      - name: Offline pcs-bench ingest fixture (producer gate)
        run: python examples/pcs_qc_release/scripts/ci_validate_pcs_bench_ingest_fixture.py
      - name: Materialize offline pcs-bench producer fixtures
        run: python scripts/generate_pcs_bench_ingest_fixture.py
      - name: LabTrust producer contract (fixture + pcs-bench validate-ingest)
        run: |
          python examples/pcs_qc_release/scripts/ci_validate_pcs_producer_contract.py
          labtrust validate-pcs-producer \
            --dir tests/fixtures/pcs_bench_reproducibility \
            --pcs-core pcs-core
          pcs-bench validate-ingest \
            --input tests/fixtures/pcs_bench_reproducibility/pcs_bench_ingest.v0.json \
            --pcs-core pcs-core
      - name: Benchmark packet fixtures
        run: python examples/pcs_qc_release/scripts/generate_benchmark_packet.py
      - name: Verify LabTrust release protocol package
        run: |
          labtrust verify-release-protocol \
            --release-dir examples/pcs_qc_release/release \
            --pcs-core pcs-core/examples/labtrust-release
      - name: LabTrust status-policy gate
        run: |
          labtrust check-status-policy \
            --release-dir examples/pcs_qc_release/release \
            --json
      - name: Generate and verify failure gallery
        run: |
          labtrust generate-failure-gallery \
            --workflow hospital_lab.qc_release \
            --out examples/pcs_qc_release/failures \
            --release-dir examples/pcs_qc_release/release
          python examples/pcs_qc_release/scripts/validate_failure_gallery.py
      - name: Registry check Phase 2 protocol artifacts
        run: |
          pcs registry check-artifact examples/pcs_qc_release/release/handoff_to_certifyedge.json
          pcs registry check-artifact examples/pcs_qc_release/release/handoff_to_pf.json
          pcs validate examples/pcs_qc_release/release/labtrust_release_fragment.json
          pcs registry check-artifact examples/pcs_qc_release/release/labtrust_release_fragment.json
      - name: Gate release fixtures against canonical pcs-core RC
        run: |
          python -m labtrust_gym.pcs.sync_pcs_core_rc \
            --verify-only \
            --pcs-core pcs-core/examples/labtrust-release
      - name: LabTrust-only smoke (deterministic)
        run: bash examples/pcs_qc_release/scripts/labtrust_only_smoke.sh
      - name: Invalid scenarios export receipts
        run: |
          export PCS_DETERMINISTIC=1
          labtrust run-demo qc-release-invalid-missing-qc --deterministic --out /tmp/missing-qc
          labtrust run-demo qc-release-invalid-unauthorized --deterministic --out /tmp/unauthorized
          labtrust export-runtime-receipt --run /tmp/missing-qc --out /tmp/missing_qc_receipt.json
          labtrust export-runtime-receipt --run /tmp/unauthorized --out /tmp/unauthorized_receipt.json
          python -c "
          import json
          from pcs_core.validate import validate_artifact
          for p in ('/tmp/missing_qc_receipt.json', '/tmp/unauthorized_receipt.json'):
              r = json.load(open(p))
              assert r['run_outcome'] == 'failed', p
              assert r['status'] == 'RuntimeObserved', p
              validate_artifact(r)
              print('OK', p, r['final_reason_code'])
          "
