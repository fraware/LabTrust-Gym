name: Documentation strict check

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/docs.yml"
      - "scripts/ci/prepare_pcs_core_python.py"
      - "scripts/build_viewer_data_from_release.sh"

permissions:
  contents: read

jobs:
  mkdocs-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: python -m pip install -e '.[docs,env]'
      - name: Verify documentation and internal links
        run: |
          mkdocs build --strict --site-dir /tmp/labtrust-mkdocs-ci
          test -s /tmp/labtrust-mkdocs-ci/index.html
          test -s /tmp/labtrust-mkdocs-ci/getting-started/index.html
      - name: Checkout pinned PCS dependency for release viewer
        uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          ref: 9c971f5f9da8a424924dd8f48d6a3b71a1009e1b
          path: pcs-core
      - name: Prepare pinned PCS Python package
        run: python scripts/ci/prepare_pcs_core_python.py pcs-core
      - name: Install PCS dependency and viewer packages
        run: |
          python -m pip install -e pcs-core/python
          python -m pip install -e '.[dev,env,plots]'
      - name: Verify viewer-data generation
        run: |
          bash scripts/build_viewer_data_from_release.sh
          test -s viewer-data/latest/latest.json
          test -s viewer-data/latest/RISK_REGISTER_BUNDLE.v0.1.json
      - name: Verify staged Pages artifact structure
        run: |
          mkdir -p /tmp/labtrust-mkdocs-ci/viewer-data
          cp -a viewer-data/latest /tmp/labtrust-mkdocs-ci/viewer-data/
          test -s /tmp/labtrust-mkdocs-ci/viewer-data/latest/latest.json
          test -s /tmp/labtrust-mkdocs-ci/viewer-data/latest/RISK_REGISTER_BUNDLE.v0.1.json
